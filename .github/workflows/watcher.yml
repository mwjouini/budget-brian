name: Vivid Healthcare Hourly Job Watcher

on:
  # Automated hourly scan (24/7 serverless in GitHub cloud)
  schedule:
    - cron: '0 * * * *'

  # Allows manual triggering from the Actions tab or API anytime
  workflow_dispatch:

  # Runs on pushes to main
  push:
    branches: ["main"]

# Sets permissions to allow git commit back to repo and deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Vivid Healthcare Hourly Scanner
        run: |
          python scanner.py

      - name: Commit and push updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated hourly scan: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
